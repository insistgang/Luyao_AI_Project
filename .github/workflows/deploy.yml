name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: luyao-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Create safe CI configuration
        run: cp local_settings.example.py local_settings.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Test UI keyboard interactions
        run: node --test tests/ui_interactions.test.cjs

  deploy-pages:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build Pages artifact
        env:
          LUYAO_APP_URL: ${{ vars.LUYAO_APP_URL }}
        run: python scripts/build_pages.py --output "$RUNNER_TEMP/pages"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
