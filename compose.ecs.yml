name: luyao-ai

services:
  luyao:
    image: luyao-ai:ecs
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APT_MIRROR: "${LUYAO_APT_MIRROR:-http://deb.debian.org}"
        PIP_INDEX_URL: "${LUYAO_PIP_INDEX_URL:-https://pypi.org/simple}"
    restart: unless-stopped
    init: true
    stop_grace_period: 40s
    ports:
      - "127.0.0.1:17860:7860"
    environment:
      MINIMAX_API_KEY: "${MINIMAX_API_KEY:-}"
      MINIMAX_API_HOST: "${MINIMAX_API_HOST:-https://api.minimaxi.com}"
      MINIMAX_CHAT_MODEL: "${MINIMAX_CHAT_MODEL:-abab6.5s-chat}"
      MINIMAX_VOICE_ID: "${MINIMAX_VOICE_ID:-luyao_voice_v1}"
      MINIMAX_SPEECH_MODEL: "${MINIMAX_SPEECH_MODEL:-speech-2.8-hd}"
      MINIMAX_WHISPER_MODEL: "${MINIMAX_WHISPER_MODEL:-speech-2.6-hd}"
      LUYAO_ACCESS_USER: "${LUYAO_ACCESS_USER:-awu}"
      LUYAO_ACCESS_PASSWORD: "${LUYAO_ACCESS_PASSWORD:-}"
      LUYAO_REQUIRE_AUTH: "${LUYAO_REQUIRE_AUTH:-true}"
      LUYAO_ALLOW_PUBLIC: "${LUYAO_ALLOW_PUBLIC:-false}"
      LUYAO_ALLOW_UNCONFIGURED: "${LUYAO_ALLOW_UNCONFIGURED:-false}"
      LUYAO_ROOT_PATH: "${LUYAO_ROOT_PATH:-/luyao}"
      LUYAO_UI_PORT: "7860"
      LUYAO_INTERNAL_API_PORT: "8000"
      LUYAO_MEMORY_DB: /app/chroma_db
      LUYAO_MEMORY_EXTRACTOR: "${LUYAO_MEMORY_EXTRACTOR:-true}"
      LUYAO_STARTUP_TIMEOUT: "180"
      GRADIO_ANALYTICS_ENABLED: "False"
      OMP_NUM_THREADS: "1"
    volumes:
      - memories:/app/chroma_db
      - runtime:/app/runtime-logs
      - embeddings:/home/user/.cache/chroma
    mem_limit: 850m
    cpus: 1.5
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  memories:
  runtime:
  embeddings:
